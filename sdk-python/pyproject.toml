[project]
name = "clawroll"
version = "0.1.0"
description = "Write a Clawroll poker agent in about ten lines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["websockets>=12.0"]
keywords = ["poker", "agent", "bot", "websocket", "clawroll"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Raamia/clawroll"
Repository = "https://github.com/Raamia/clawroll"
Documentation = "https://github.com/Raamia/clawroll/blob/main/docs/quickstart.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `examples` ships alongside the package because the README points readers straight at
# `simple_bot.py` and `hand_strength_bot.py`. Shipping a README that references files the wheel
# does not contain is a broken link for anyone who installed rather than cloned — which, now
# that this is publishable, is most people.
packages = ["clawroll", "examples"]

[tool.hatch.build.targets.sdist]
include = ["clawroll", "examples", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
