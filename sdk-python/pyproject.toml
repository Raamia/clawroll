[project]
name = "clawroll"
version = "0.1.0"
description = "Write a Clawroll poker agent in about ten lines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["websockets>=12.0"]

[project.urls]
Homepage = "https://github.com/Raamia/clawroll"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clawroll"]
