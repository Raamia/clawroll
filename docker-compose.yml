# Local development dependencies for Clawroll.
# Mirrors what runs on AWS: RDS Postgres, and nothing else. Redis was removed from both
# once it became clear no application code referenced it.
#   pnpm dev:infra        start
#   pnpm dev:infra:reset  wipe volumes and restart (destroys local data)

services:
  postgres:
    image: postgres:16-alpine
    container_name: clawroll-postgres
    environment:
      POSTGRES_USER: clawroll
      POSTGRES_PASSWORD: clawroll_dev
      POSTGRES_DB: clawroll
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clawroll -d clawroll']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
